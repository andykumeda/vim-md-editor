# nginx-vd.conf — sample config for VimDown web
#
# Install:
#   sudo cp nginx-vd.conf /etc/nginx/sites-available/vd
#   sudo ln -s /etc/nginx/sites-available/vd /etc/nginx/sites-enabled/vd
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, run: sudo certbot --nginx -d your.domain.com

server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;   # ← replace with your domain or server IP

    root /var/www/vd;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; script-src 'self'; connect-src 'self'" always;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Hashed assets: cache forever ──────────────────────────────────────────
    # Vite fingerprints all asset filenames (e.g. index-X3CM99mT.js)
    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── index.html: no cache (always fetch latest) ────────────────────────────
    location = /index.html {
        expires epoch;
        add_header Cache-Control "no-store";
    }

    # ── SPA fallback (belt + suspenders for hash routing) ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

