<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background with rounded rect -->
  <rect width="512" height="512" rx="110" fill="#0f1117"/>
  <!-- Terminal frame -->
  <rect x="60" y="100" width="392" height="312" rx="24" fill="none" stroke="#1a2235" stroke-width="3"/>
  <!-- Inset document area -->
  <rect x="70" y="110" width="372" height="292" rx="18" fill="#161c2d"/>
  <!-- Green accent: vim caret / right-angle -->
  <path d="M130 190 L178 238 L130 286" fill="none" stroke="#34d399" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal line: text cursor -->
  <line x1="200" y1="286" x2="330" y2="286" stroke="#34d399" stroke-width="22" stroke-linecap="round"/>
  <!-- Small lines suggesting text content -->
  <line x1="200" y1="210" x2="370" y2="210" stroke="#2a3655" stroke-width="12" stroke-linecap="round"/>
  <line x1="200" y1="238" x2="340" y2="238" stroke="#2a3655" stroke-width="12" stroke-linecap="round"/>
  <line x1="200" y1="320" x2="310" y2="320" stroke="#2a3655" stroke-width="12" stroke-linecap="round"/>
  <line x1="130" y1="346" x2="370" y2="346" stroke="#1e2d4a" stroke-width="10" stroke-linecap="round"/>
</svg>
